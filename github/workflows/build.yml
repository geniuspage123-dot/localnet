name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 1. Unzip project
        run: unzip -q localnet.zip -d app

      - name: 2. Install packages
        working-directory: app
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps || echo "expo install --fix skipped"

      - name: 2b. Fix bugs inside react-native-background-actions
        working-directory: app
        run: |
          set -o pipefail
          {
          npm ls react-native-background-actions || true
          python3 - <<'PY'
          import re, glob, os
          base = 'node_modules/react-native-background-actions/android/src/main/java'
          # 1) remove the stray '#' typo in front of ServiceCompat
          for f in glob.glob(base + '/**/*.java', recursive=True):
              t = open(f).read()
              n = re.sub(r'^([ \t]*)#[ \t]*(?=ServiceCompat)', r'\1', t, flags=re.M)
              # 2) the old androidx.core has no ServiceCompat.startForeground: drop that import,
              #    a small replacement class in the same package is used instead
              n = re.sub(r'^import\s+androidx\.core\.app\.ServiceCompat\s*;[ \t]*\r?\n', '', n, flags=re.M)
              if n != t:
                  open(f, 'w').write(n)
                  print('PATCHED', f)
          pkg_dir = os.path.join(base, 'com', 'asterinet', 'react', 'bgactions')
          open(os.path.join(pkg_dir, 'ServiceCompat.java'), 'w').write("""package com.asterinet.react.bgactions;

          import android.app.Notification;
          import android.app.Service;
          import android.content.pm.ServiceInfo;
          import android.os.Build;

          final class ServiceCompat {
              static void startForeground(Service service, int id, Notification notification, int type) {
                  if (Build.VERSION.SDK_INT >= 29) {
                      service.startForeground(id, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MANIFEST);
                  } else {
                      service.startForeground(id, notification);
                  }
              }

              static void stopForeground(Service service, int flags) {
                  service.stopForeground(flags);
              }
          }
          """.replace('\n          ', '\n'))
          print('CREATED ServiceCompat.java')
          PY
          echo "---- ServiceCompat usages ----"
          grep -rn "ServiceCompat" node_modules/react-native-background-actions/android/src/main/java || true
          echo "---- class files ----"
          ls node_modules/react-native-background-actions/android/src/main/java/com/asterinet/react/bgactions/
          } 2>&1 | tee ../patch.log

      - name: 3. Check app config and JS code
        working-directory: app
        run: |
          set -o pipefail
          npx expo config --type public > /dev/null
          npx expo export --platform android --output-dir /tmp/jsout 2>&1 | tee ../js-check.log

      - name: 4. Create Android project
        working-directory: app
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee ../prebuild.log

      - name: 5. Build APK
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --warning-mode none \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../../build.log

      - name: Show the error (only if something failed)
        if: failure()
        run: |
          {
            echo "## Build failed. Send this text to Claude"
            for f in patch.log js-check.log prebuild.log build.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                echo '```'
                (grep -n -E -A 14 "What went wrong|Error:|error:|Unable to resolve|SyntaxError|ERR!" "$f" || tail -n 40 "$f") | head -n 70
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            patch.log
            js-check.log
            prebuild.log
            build.log
          if-no-files-found: ignore

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalNet-Connect-APK
          path: app/android/app/build/outputs/apk/release/*.apk
