name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 1. Unzip project
        run: unzip -q localnet.zip -d app

      - name: 2. Install packages
        working-directory: app
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps || echo "expo install --fix skipped"

      - name: 2b. Fix typo bug inside react-native-background-actions
        working-directory: app
        run: |
          npm ls react-native-background-actions || true
          python3 - <<'PY'
          import re, glob
          for f in glob.glob('node_modules/react-native-background-actions/android/src/main/java/**/*.java', recursive=True):
              lines = open(f).read().split('\n')
              out, i, changed = [], 0, False
              while i < len(lines):
                  if re.match(r'^\s*#', lines[i]):
                      j, depth = i, 0
                      while j < len(lines):
                          depth += lines[j].count('(') - lines[j].count(')')
                          if depth <= 0 and ';' in lines[j]:
                              break
                          j += 1
                      stmt = '\n'.join(lines[i:j + 1])
                      stmt = re.sub(r'^(\s*)#', r'\1', stmt)
                      k = stmt.find('ServiceCompat.startForeground(')
                      if k >= 0:
                          p = k + len('ServiceCompat.startForeground(')
                          d, a, parts, e = 0, p, [], None
                          for n in range(p, len(stmt)):
                              c = stmt[n]
                              if c == '(':
                                  d += 1
                              elif c == ')':
                                  if d == 0:
                                      parts.append(stmt[a:n])
                                      e = n
                                      break
                                  d -= 1
                              elif c == ',' and d == 0:
                                  parts.append(stmt[a:n])
                                  a = n + 1
                          if e is not None and len(parts) == 4:
                              parts[3] = ' ServiceInfo.FOREGROUND_SERVICE_TYPE_MANIFEST'
                              stmt = stmt[:p] + ','.join(parts) + stmt[e:]
                      out.extend(stmt.split('\n'))
                      i = j + 1
                      changed = True
                  else:
                      out.append(lines[i])
                      i += 1
              if changed:
                  text = '\n'.join(out)
                  if 'import android.content.pm.ServiceInfo;' not in text:
                      text = re.sub(r'(^package [^;]+;)', r'\1\nimport android.content.pm.ServiceInfo;', text, count=1, flags=re.M)
                  open(f, 'w').write(text)
                  print('PATCHED', f)
          PY
          grep -rn -B3 -A6 "ServiceCompat" node_modules/react-native-background-actions/android/src/main/java || true

      - name: 3. Check app config and JS code
        working-directory: app
        run: |
          set -o pipefail
          npx expo config --type public > /dev/null
          npx expo export --platform android --output-dir /tmp/jsout 2>&1 | tee ../js-check.log

      - name: 4. Create Android project
        working-directory: app
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee ../prebuild.log

      - name: 5. Build APK
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --warning-mode none \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../../build.log

      - name: Show the error (only if something failed)
        if: failure()
        run: |
          {
            echo "## Build failed. Send this text to Claude"
            for f in js-check.log prebuild.log build.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                echo '```'
                (grep -n -E -A 14 "What went wrong|Error:|error:|Unable to resolve|SyntaxError|ERR!" "$f" || tail -n 40 "$f") | head -n 70
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            js-check.log
            prebuild.log
            build.log
          if-no-files-found: ignore

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalNet-Connect-APK
          path: app/android/app/build/outputs/apk/release/*.apk
